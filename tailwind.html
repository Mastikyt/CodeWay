<!doctype html>
<html lang="ru" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="15 заданий по вёрстке на Tailwind CSS v4: от карточки профиля до дизайн-системы."
    />
    <title>Tailwind-задания — CodeWay</title>
    <script>
      // Тема до первого рендера — чтобы не было вспышки светлого фона
      ;(function () {
        var saved = null
        try {
          saved = localStorage.getItem('tw-theme')
        } catch (e) {}
        var dark =
          saved === 'dark' ||
          (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/tailwind/main.js"></script>
  </body>
</html>
